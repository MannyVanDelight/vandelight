<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f1ec">
<title>Interval Timer</title>
<style>
:root{
  --bg:#f3f1ec; --surface:#ffffff; --fg:#22262a; --muted:#6b7177; --line:#dedad2;
  --active:#f26b1d; --active-ink:#2a1405;
  --rest:#1fa35c; --rest-ink:#04200e;
  --prep:#3d4a56; --prep-ink:#f2f4f6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1b1f23; --surface:#262b30; --fg:#eef0f2; --muted:#9aa1a8; --line:#353b41;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1b1f23; --surface:#262b30; --fg:#eef0f2; --muted:#9aa1a8; --line:#353b41;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  transition:background-color .35s ease,color .35s ease;
}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.screen{display:none;height:100%;flex-direction:column;max-width:560px;margin:0 auto;padding:20px 20px 24px}
.screen.on{display:flex}

/* ---------- Setup ---------- */
.setup h1{font-size:2rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.01em}
.setup .sub{color:var(--muted);margin:0 0 20px;font-size:1rem}
.rows{display:flex;flex-direction:column;gap:2px;background:var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);padding:10px 12px 10px 18px}
.row .name{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:650}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.hint{display:block;font-size:.85rem;font-weight:500;color:var(--muted);margin-top:1px}
.setup{height:auto;min-height:100%}
#setLabel small{display:block;font-size:.85rem;font-weight:600;opacity:.8}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:14px;border:0;background:var(--bg);font-size:1.6rem;font-weight:700;line-height:1}
.stepper button:active{transform:scale(.94)}
.stepper .val{min-width:4.2ch;text-align:center;font-size:1.5rem;font-weight:750}
.summary{margin:18px 4px 0;color:var(--muted);font-size:1.05rem}
.summary b{color:var(--fg);font-weight:750}
.spacer{flex:1;min-height:20px}
.big{width:100%;height:64px;border:0;border-radius:20px;font-size:1.35rem;font-weight:800}
.go{background:var(--active);color:var(--active-ink)}
.note{color:var(--muted);font-size:.85rem;text-align:center;margin:12px 0 0}

/* ---------- Run ---------- */
body[data-phase="active"]{background:var(--active);color:var(--active-ink)}
body[data-phase="rest"]{background:var(--rest);color:var(--rest-ink)}
body[data-phase="prep"]{background:var(--prep);color:var(--prep-ink)}
.run .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:1.1rem;font-weight:700}
.run .top .total{text-align:right;opacity:.85}
.run .top .total small{display:block;font-size:.85rem;font-weight:600;opacity:.8}
.run .middle{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0}
.phase-name{font-size:clamp(1.8rem,9vw,3rem);font-weight:800;margin:0;letter-spacing:-.01em}
.clock{font-size:clamp(6rem,34vw,15rem);font-weight:800;line-height:.95;letter-spacing:-.04em;margin:6px 0 18px}
.bar{width:100%;height:12px;border-radius:6px;background:rgba(0,0,0,.18);overflow:hidden}
body[data-phase="prep"] .bar{background:rgba(255,255,255,.18)}
.bar i{display:block;height:100%;width:0;background:currentColor;border-radius:6px;transition:width .1s linear}
.next{margin-top:16px;font-size:1.15rem;font-weight:650;opacity:.85}
.controls{display:flex;gap:12px}
.controls button{flex:1;height:64px;border-radius:20px;font-size:1.25rem;font-weight:800;border:3px solid currentColor;background:transparent}
.controls .primary{background:currentColor}
.controls .primary span{color:var(--paint)}
body[data-phase="active"]{--paint:var(--active)}
body[data-phase="rest"]{--paint:var(--rest)}
body[data-phase="prep"]{--paint:var(--prep)}
.paused .clock,.paused .phase-name{opacity:.55}

/* ---------- Done ---------- */
.done .middle{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.done h2{font-size:2.4rem;font-weight:800;margin:0 0 8px}
.done p{color:var(--muted);font-size:1.15rem;margin:0}
.done .btns{display:flex;flex-direction:column;gap:12px}
.ghost{background:transparent;border:3px solid var(--line)}

@media (prefers-reduced-motion: reduce){body,.bar i{transition:none}}
</style>
</head>
<body>

<section class="screen setup on" id="setup">
  <h1>Interval timer</h1>
  <p class="sub">Set your periods, then press start.</p>
  <div class="rows" id="rows"></div>
  <p class="summary">Workout length <b id="sumTotal">0:00</b></p>
  <div class="spacer"></div>
  <button class="big go" id="startBtn">Start</button>
  <p class="note">Keep this screen open while training. Turn off silent mode to hear the beeps.</p>
</section>

<section class="screen run" id="run" aria-live="off">
  <div class="top">
    <div id="setLabel">Set 1 of 8</div>
    <div class="total"><span id="elapsed">0:00</span><small>of <span id="totalLen">0:00</span></small></div>
  </div>
  <div class="middle">
    <p class="phase-name" id="phaseName">Get ready</p>
    <div class="clock" id="clock">0:10</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="next" id="next"></div>
  </div>
  <div class="controls">
    <button id="stopBtn">Stop</button>
    <button class="primary" id="pauseBtn"><span id="pauseTxt">Pause</span></button>
  </div>
</section>

<section class="screen done" id="done">
  <div class="middle">
    <h2>Workout complete</h2>
    <p id="doneTxt"></p>
  </div>
  <div class="btns">
    <button class="big go" id="againBtn">Start again</button>
    <button class="big ghost" id="editBtn">Change settings</button>
  </div>
</section>

<script>
(function(){
  // ---------- Settings ----------
  var S = {active:30, rest:15, exercises:3, sets:4, setBreak:60, prep:10};
  try{ var saved = JSON.parse(localStorage.getItem('interval-timer-settings')||'null');
       if(saved) for(var k in S) if(typeof saved[k]==='number') S[k]=saved[k]; }catch(e){}
  function save(){ try{ localStorage.setItem('interval-timer-settings', JSON.stringify(S)); }catch(e){} }

  var FIELDS = [
    {key:'active',    name:'Active',    hint:null,                    color:'var(--active)', min:5, max:3600, step:5, time:true},
    {key:'rest',      name:'Rest',      hint:'Between exercises',     color:'var(--rest)',   min:0, max:3600, step:5, time:true},
    {key:'exercises', name:'Exercises', hint:'Per set',               color:null,            min:1, max:50,   step:1, time:false},
    {key:'sets',      name:'Sets',      hint:null,                    color:null,            min:1, max:99,   step:1, time:false},
    {key:'setBreak',  name:'Set break', hint:'Between sets',          color:'var(--rest)',   min:0, max:3600, step:5, time:true},
    {key:'prep',      name:'Get ready', hint:'Before the first set',  color:'var(--prep)',   min:0, max:120,  step:5, time:true}
  ];

  function fmt(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return m+':'+(s<10?'0':'')+s; }
  function totalLen(){ return S.prep + S.sets*S.exercises*S.active + S.sets*(S.exercises-1)*S.rest + (S.sets-1)*S.setBreak; }

  var rows = document.getElementById('rows');
  FIELDS.forEach(function(f){
    var row = document.createElement('div'); row.className='row';
    row.innerHTML =
      '<div class="name">'+(f.color?'<span class="dot" style="background:'+f.color+'"></span>':'<span class="dot" style="border:2px solid var(--muted)"></span>')+'<span>'+f.name+(f.hint?'<small class="hint">'+f.hint+'</small>':'')+'</span></div>'+
      '<div class="stepper"><button aria-label="Decrease '+f.name+'">−</button><span class="val" aria-live="polite"></span><button aria-label="Increase '+f.name+'">+</button></div>';
    rows.appendChild(row);
    var btns=row.querySelectorAll('button'), val=row.querySelector('.val');
    f.render=function(){ val.textContent = f.time? fmt(S[f.key]) : S[f.key]; };
    function change(dir){
      var step = f.time && S[f.key]>=120 ? 15 : f.step;
      S[f.key]=Math.min(f.max,Math.max(f.min,S[f.key]+dir*step));
      f.render(); updateSummary(); save();
    }
    [[btns[0],-1],[btns[1],1]].forEach(function(p){
      var b=p[0], dir=p[1], t1=null, t2=null;
      function stop(){ clearTimeout(t1); clearInterval(t2); t1=t2=null; }
      b.addEventListener('pointerdown',function(e){ e.preventDefault(); change(dir); stop();
        t1=setTimeout(function(){ t2=setInterval(function(){change(dir);},90); },420); });
      ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev,stop); });
      b.addEventListener('click',function(e){ if(e.detail===0) change(dir); }); // keyboard
    });
    f.render();
  });
  function updateSummary(){ document.getElementById('sumTotal').textContent=fmt(totalLen()); }
  updateSummary();

  // ---------- Audio (generated, no files needed) ----------
  var ctx=null;
  var master=null;
  function unlockAudio(){
    try{
      // iOS 17+: treat as media playback so sounds aren't silenced by the ring/silent switch
      if(navigator.audioSession) navigator.audioSession.type='playback';
      if(!ctx){
        var AC=window.AudioContext||window.webkitAudioContext; ctx=new AC();
        var comp=ctx.createDynamicsCompressor();
        comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.15;
        master=ctx.createGain(); master.gain.value=1.4;
        master.connect(comp); comp.connect(ctx.destination);
      }
      var b=ctx.createBuffer(1,1,22050), s=ctx.createBufferSource(); s.buffer=b; s.connect(ctx.destination); s.start(0);
      return ctx.state!=='running' ? ctx.resume() : Promise.resolve();
    }catch(e){ return Promise.resolve(); }
  }
  // one soft, plucked voice: quick attack, smooth exponential decay, optional pitch glide
  function voice(o){
    if(!ctx) return;
    var t=ctx.currentTime+0.02+(o.at||0), osc=ctx.createOscillator(), g=ctx.createGain(), v=o.vol||0.25;
    osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(o.f,t);
    if(o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2,t+(o.glide||o.dur*0.5));
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+(o.atk||0.006));
    if(o.hold) g.gain.setValueAtTime(v,t+Math.max(0.012,o.dur-0.04)); // hold at full level, then a quick fade (crisp, loud)
    g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t+o.dur+0.05);
  }
  function bell(f,at,dur,vol){ // sine body + faint octave shimmer
    voice({f:f,at:at,dur:dur,vol:vol});
    voice({f:f*2,at:at,dur:dur*0.5,vol:vol*0.18});
  }
  // crisp note = held square (bite, carries outdoors) + held sine/triangle (body, keeps it musical)
  function crisp(f,at,dur,vol,f2){
    voice({f:f,f2:f2,glide:0.03,at:at,dur:dur,vol:vol*0.55,type:'square',hold:1,atk:0.003});
    voice({f:f,f2:f2,glide:0.03,at:at,dur:dur,vol:vol,type:'triangle',hold:1,atk:0.003});
  }
  var SND = {
    // rest + get ready, last 5 s: one clean note per second that climbs in pitch (5 to 1), building into the start
    count: function(sec){ var f={5:1047,4:1175,3:1319,2:1568,1:1760}[sec]||1047; crisp(f,0,0.14,0.28); },
    // active, last 5 s: single sharp high hit with an upward flick
    countActive: function(){ crisp(1760,0,0.17,0.32,2349); },
    // active starts: simple double beep on one high note, second slightly longer
    go: function(){ crisp(2093,0,0.09,0.3); crisp(2093,0.14,0.22,0.3); },
    // active ends: two clean separate notes rising a fourth (E6 to A6), second one rings out
    end: function(){ crisp(1319,0,0.11,0.28); voice({f:1760,at:0.13,dur:0.5,vol:0.3,type:'triangle',atk:0.003}); voice({f:1760,at:0.13,dur:0.3,vol:0.12,type:'square',atk:0.003}); },
    // workout complete: warm, smooth major-chord bloom (pure sine, no buzz) with a soft bell on top
    finish: function(){
      var t=1.0;
      voice({f:523, at:t,dur:2.8,vol:0.2, atk:0.12});
      voice({f:659, at:t,dur:2.6,vol:0.16,atk:0.14});
      voice({f:784, at:t,dur:2.6,vol:0.16,atk:0.16});
      voice({f:1047,at:t,dur:2.4,vol:0.14,atk:0.18});
      bell(2093,t+0.2,1.8,0.16);
    }
  };

  // ---------- Screen wake lock ----------
  var lock=null;
  function keepAwake(){ try{ if('wakeLock' in navigator) navigator.wakeLock.request('screen').then(function(l){lock=l;}).catch(function(){}); }catch(e){} }
  function releaseAwake(){ try{ if(lock){ lock.release(); lock=null; } }catch(e){} }

  // ---------- Runner ----------
  var R=null, timer=null;
  var $=function(id){return document.getElementById(id);};
  var themeMeta=document.querySelector('meta[name="theme-color"]');

  function build(){
    var p=[], at=0;
    function add(o){ o.start=at; at+=o.d*1000; p.push(o); }
    if(S.prep>0) add({t:'prep',d:S.prep,set:1,ex:1});
    for(var s=1;s<=S.sets;s++){
      for(var x=1;x<=S.exercises;x++){
        add({t:'active',d:S.active,set:s,ex:x});
        if(x<S.exercises && S.rest>0) add({t:'rest',d:S.rest,set:s,ex:x});
      }
      if(s<S.sets && S.setBreak>0) add({t:'rest',kind:'break',d:S.setBreak,set:s,ex:S.exercises});
    }
    return {phases:p,total:at};
  }
  function now(){ return performance.now(); }
  function elapsed(){ return (R.pausedAt!==null?R.pausedAt:now()) - R.startedAt - R.pausedTotal; }

  function show(id){ ['setup','run','done'].forEach(function(s){ $(s).classList.toggle('on',s===id); }); }
  function setPhaseColor(t){
    document.body.style.removeProperty('background-color');
    document.body.style.removeProperty('--paint');
    if(t) document.body.setAttribute('data-phase',t); else document.body.removeAttribute('data-phase');
    var c = t ? getComputedStyle(document.documentElement).getPropertyValue('--'+t).trim()
              : getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if(themeMeta) themeMeta.setAttribute('content',c);
  }

  function start(){
    var audioReady=unlockAudio(); keepAwake();
    var b=build();
    R={phases:b.phases,total:b.total,startedAt:now(),pausedTotal:0,pausedAt:null,idx:-1,beeped:{}};
    $('totalLen').textContent=fmt(R.total/1000);
    $('run').classList.remove('paused'); $('pauseTxt').textContent='Pause';
    show('run'); tick();
    // start the clock once audio is actually running, so the get-ready countdown is heard
    clearInterval(timer); timer=null;
    var go=false, begin=function(){ if(go) return; go=true; R.startedAt=now(); R.beeped={}; timer=setInterval(tick,100); tick(); };
    audioReady.then(begin,begin); setTimeout(begin,600);
  }

  function tick(){
    var e=elapsed();
    if(e>=R.total){ finish(); return; }
    var i=R.phases.length-1;
    while(i>0 && R.phases[i].start>e) i--;
    var ph=R.phases[i];

    if(i!==R.idx){
      var prev=R.idx>=0?R.phases[R.idx]:null;
      if(prev && prev.t==='active') SND.end();
      if(ph.t==='active') (prev && prev.t==='active') ? setTimeout(SND.go,800) : SND.go();
      R.idx=i; setPhaseColor(ph.t);
      $('phaseName').textContent = ph.t==='active'?'Active':ph.kind==='break'?'Set break':ph.t==='rest'?'Rest':'Get ready';
      var nx=R.phases[i+1];
      $('next').textContent = nx ? 'Next: '+(nx.t==='active'?'active':nx.kind==='break'?'set break':'rest')+' '+fmt(nx.d) : 'Last one';
      var sub = ph.kind==='break' ? 'Set complete' : ph.t==='rest' ? 'Exercise '+ph.ex+' of '+S.exercises+' done' : 'Exercise '+ph.ex+' of '+S.exercises;
      $('setLabel').innerHTML = 'Set '+ph.set+' of '+S.sets+'<small>'+sub+'</small>';
    }

    var remain=ph.start+ph.d*1000-e, sec=Math.ceil(remain/1000);
    $('clock').textContent=fmt(sec);
    $('bar').style.width=(100*(1-remain/(ph.d*1000)))+'%';

    // active: fade orange to red from 15 s to 10 s left, red for the last 10 s
    if(ph.t==='active'){
      var f=Math.min(1,Math.max(0,(15000-remain)/5000));
      var col='rgb('+Math.round(242+(217-242)*f)+','+Math.round(107+(38-107)*f)+','+Math.round(29+(28-29)*f)+')';
      document.body.style.backgroundColor=col;
      document.body.style.setProperty('--paint',col);
      if(themeMeta) themeMeta.setAttribute('content',col);
    }
    $('elapsed').textContent=fmt(Math.floor(e/1000));

    // last 5 seconds: high beep before active, low beep at the end of active
    var nextPh=R.phases[i+1];
    if(sec>=1 && sec<=5 && R.pausedAt===null){
      var key=i+'-'+sec;
      if(ph.t==='active'){ if(!R.beeped[key]){ R.beeped[key]=1; SND.countActive(); } }
      else if(ph.t==='prep' || (nextPh && nextPh.t==='active')){ if(!R.beeped[key]){ R.beeped[key]=1; SND.count(sec); } }
    }
  }

  function finish(){
    clearInterval(timer); timer=null;
    var last=R.phases[R.phases.length-1];
    if(last && last.t==='active'){ SND.end(); SND.finish(); }
    releaseAwake(); setPhaseColor(null);
    $('doneTxt').textContent=S.sets+(S.sets===1?' set':' sets')+' of '+S.exercises+(S.exercises===1?' exercise':' exercises')+' in '+fmt(R.total/1000);
    show('done');
  }

  function togglePause(){
    unlockAudio();
    if(R.pausedAt===null){ R.pausedAt=now(); $('pauseTxt').textContent='Resume'; $('run').classList.add('paused'); releaseAwake(); }
    else { R.pausedTotal+=now()-R.pausedAt; R.pausedAt=null; $('pauseTxt').textContent='Pause'; $('run').classList.remove('paused'); keepAwake(); }
    tick();
  }

  var stopArmed=null;
  function resetStopBtn(){ clearTimeout(stopArmed); stopArmed=null; $('stopBtn').textContent='Stop'; }
  function stopRun(){
    // first tap arms, second tap within 3 s stops (browser confirm dialogs are blocked here)
    if(!stopArmed){
      $('stopBtn').textContent='Tap to stop';
      stopArmed=setTimeout(resetStopBtn,3000);
      return;
    }
    resetStopBtn();
    clearInterval(timer); timer=null; releaseAwake(); setPhaseColor(null); show('setup');
  }

  $('startBtn').addEventListener('click',start);
  $('againBtn').addEventListener('click',start);
  $('editBtn').addEventListener('click',function(){ show('setup'); });
  $('pauseBtn').addEventListener('click',togglePause);
  $('stopBtn').addEventListener('click',stopRun);

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible' && R && timer){
      if(ctx && ctx.state!=='running') ctx.resume();
      if(R.pausedAt===null) keepAwake();
      tick();
    }
  });
})();
</script>
</body>
</html>
