,245,.7);text-align:center;margin-top:1.25rem\">{{ lbTitle }}<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#38A1FF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#38A1FF&quot;,&quot;#E4572E&quot;,&quot;#C9A227&quot;,&quot;#8B7CF6&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;customCursor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;revealOnScroll&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    theme: null,\n    menuOpen: false,\n    isMobile: false,\n    project: null,\n    reelA: false,\n    reelB: false,\n    lb: null\n  };\n\n  progressRef = React.createRef();\n  topRef = React.createRef();\n  modalRef = React.createRef();\n  lbImgRef = React.createRef();\n  lbVideoRef = React.createRef();\n  lbFrameRef = React.createRef();\n\n  /* Case-study stills: assigned imperatively so no request fires before hydration. */\n  csImg = {\n    uoPath: 'assets/UO-PathOfDelight-web-meta.jpg',\n    uoAmbling: 'assets/UO-AmblingReverie-web-meta.jpg',\n    uoSanctuary: 'assets/UO-Sanctuary-web-meta.jpg',\n    uoFleeting: 'assets/UO-Fleeting-web-meta.jpg',\n    uoEchoes: 'assets/UO-Echoes of Delight-web-meta.jpg',\n    uoAuramancer: 'assets/UO-Auramancer-web-meta.jpg',\n    sdHero: 'assets/shattered-dawn-hero.jpg'\n  };\n\n  /* ---------- data ---------- */\n  clients = [\n    ['Amblin', 'amblin'], ['Paramount', 'paramount'], ['Universal', 'universal'], ['Sony', 'sony'],\n    ['The Third Floor', 'thirdfloor'], ['Warner Bros', 'warner'], ['Weta', 'weta'], ['Columbia', 'columbia'],\n    ['Audi', 'audi'], ['Porsche', 'porsche'], ['Toyota', 'toyota'], ['YouTube', 'youtube']\n  ].map(([name, file]) => ({ name, src: 'assets/' + file + '.png' }));\n\n  posters = [\n    ['The Adventures of Tintin', 'assets/tintin.jpg'],\n    ['Wonder Woman', 'assets/wonderwoman.jpg'],\n    ['Mortal Engines', 'assets/mortalengines.JPG'],\n    ['Tomb Raider', 'assets/tombraider.JPG'],\n    ['Avatar: Fire and Ash', 'assets/Avatar.JPG'],\n    ['Horizon Zero Dawn', 'assets/horizon.jpg']\n  ].map(([name, src]) => ({ name, src, slot: src }));\n\n  projects = [\n    { id: 'umami', title: 'Umami Origami', sub: 'Surreal Fashion Portraits', badge: 'Case Study', cover: 'assets/UO-Sanctuary-web-meta.jpg' },\n    { id: 'mooning', title: 'Mooning The Ignorant', sub: 'Animation Loops', badge: 'Case Study', cover: 'assets/1155.jpg' },\n    { id: 'shattered', title: 'Shattered Dawn', sub: 'Vote Your Heroine', badge: 'Case Study', cover: 'assets/ShatteredDawn01.jpg' },\n    { id: 'melodyssey', title: 'Melodyssey', sub: 'Audio-Visual Odyssey', badge: 'In Production', cover: 'assets/melodyssey-cover.jpg' },\n    { id: 'like2like', title: 'Like 2 Like', sub: 'Coming Soon', badge: 'In Production', cover: 'assets/like2like-cover.jpg' },\n    { id: 'colorburst', title: 'Color Burst Fury', sub: 'Coming Soon', badge: 'In Production', cover: 'assets/colorburstfury-cover.jpg' }\n  ].map(p => ({ ...p, slot: p.cover, aria: 'Open ' + p.title }));\n\n  bas = [\n    { title: 'Day to Night Conversion', sub: 'Raw Shoot vs Final Look', before: 'assets/Day-To-Night.mp4_snapshot_00.01.899.jpg', after: 'assets/Day-To-Night.mp4_snapshot_00.01.123.jpg' },\n    { title: 'Digital Car Integration', sub: 'Location Shoot vs Final Look', before: 'assets/HopeRiver-before.jpg', after: 'assets/HopeRiver-after.jpg' },\n    { title: 'Adding Sci-fi VFX', sub: 'RAW Footage vs Final Look', before: 'assets/garage-before.jpg', after: 'assets/garage-after.jpg' },\n    { title: 'Digital Twin Property', sub: 'Empty Lot vs 3D Render', before: 'assets/Arch-Vis-before.jpg', after: 'assets/Arch-Vis-after.jpg' }\n  ];\n\n  loops = [\n    ['01', 'When Moon', '02lmz4Oj9zw', 'Marks a new era, one in which we claim territory that was out of reach before. An homage to A Trip to the Moon — and the foundation all the other pieces stand on.'],\n    ['02', 'Bool Trap', 'LqX-heAaomk', \"Whether bull or cat, don't get trapped in wool like that.\"],\n    ['03', 'Mind Stuck', '0z6q5S3Y-E4', 'Sometimes all you need is the right tool.'],\n    ['04', 'Hard Crack', 'xfLrENjja6w', \"It requires high temperatures to get a hard crack. If you can't handle the heat, pull the loop for paper hands.\"],\n    ['05', 'Game Changer', 'X6zADmv8FrI', 'The table has become part of the ball that ends one game and starts another. Falling into the rabbit hole, infinitely.'],\n    ['06', 'Beace', '8WQpUcAoKiI', 'Blockchain brings peace, as it emerges from the deep.'],\n    ['07', '1155', 'NRKmcUmN18w', 'Protocol, or habit?'],\n    ['08', 'Good Night', 'Y2BCQCgMD6c', 'Sometimes all you need to do is go to bed. GN until GM.'],\n    ['09', 'The Bearg', 'uFlOMGw90Ok', 'Resistance is futile.']\n  ].map(([num, title, yt, text]) => ({\n    num, title, yt, text,\n    thumb: 'https://i.ytimg.com/vi/' + yt + '/hqdefault.jpg',\n    aria: 'Play ' + title\n  }));\n\n  /* Client-work media grid. kind: image | video. yt set for video tiles. */\n  tiles = [\n    { title: 'Haute Couture Runway', sub: 'Editorial Direction', kind: 'image', src: 'assets/client/couture-01.jpg', col: '1/-1', row: 'span 2' },\n    { title: 'Commercial Campaign', sub: 'VFX Supervision & Editing', kind: 'video', src: 'assets/client/campaign-reel.mp4', row: 'span 2' },\n    { title: '', sub: '', kind: 'image', src: 'assets/client/still-01.jpg', row: 'span 1' },\n    { title: '', sub: '', kind: 'image', src: 'assets/client/still-02.jpg', row: 'span 1' },\n    { title: '', sub: '', kind: 'image', src: 'assets/client/still-03.jpg', row: 'span 2' },\n    { title: '', sub: '', kind: 'video', src: 'assets/client/spot-02.mp4', row: 'span 1' },\n    { title: '', sub: '', kind: 'image', src: 'assets/client/still-04.jpg', row: 'span 1' },\n    { title: '', sub: '', kind: 'image', src: 'assets/client/still-05.jpg', row: 'span 1' },\n    { title: '', sub: '', kind: 'image', src: 'assets/client/still-06.jpg', row: 'span 1' }\n  ].map((t, i) => ({\n    ...t,\n    index: i,\n    col: t.col || 'auto',\n    thumb: t.kind === 'video' ? (t.poster || t.src.replace(/\\.mp4$/, '-poster.jpg')) : t.src,\n    slot: t.src,\n    kindLabel: t.kind === 'video' ? 'video slot — drop .mp4 + -poster.jpg' : 'image slot',\n    glyph: t.kind === 'video' ? '\\u25B6' : '\\u2197',\n    noTitle: !t.title,\n    aria: (t.title || 'Client work') + ' — enlarge'\n  }));\n\n  /* ---------- lifecycle ---------- */\n  componentDidMount() {\n    const stored = (() => { try { return localStorage.getItem('mvd-theme'); } catch (e) { return null; } })();\n    const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;\n    this.applyTheme(stored || this.props.defaultTheme || (sysDark ? 'dark' : 'light'));\n    this.applyAccent();\n\n    this.mq = window.matchMedia('(max-width: 1000px)');\n    this.onMQ = () => this.setState({ isMobile: this.mq.matches, menuOpen: false });\n    this.mq.addEventListener('change', this.onMQ);\n    this.setState({ isMobile: this.mq.matches });\n\n    this.onScroll = () => {\n      if (this.rafScroll) return;\n      this.rafScroll = requestAnimationFrame(() => {\n        this.rafScroll = null;\n        const y = this.scrollY();\n        if (y > 4) this.sawScroll = true;\n        const page = document.getElementById('top');\n        let p = 0;\n        if (page) {\n          const r = page.getBoundingClientRect();\n          const span = r.height - window.innerHeight;\n          if (span > 0) p = Math.max(0, Math.min(1, -r.top / span));\n        }\n        if (this.progressRef.current) this.progressRef.current.style.transform = 'scaleX(' + p + ')';\n        const t = this.topRef.current;\n        if (t) {\n          const show = y > 500;\n          t.style.opacity = show ? '1' : '0';\n          t.style.visibility = show ? 'visible' : 'hidden';\n          t.style.transform = show ? 'translateY(0)' : 'translateY(20px)';\n        }\n        this.sweepReveal();\n      });\n    };\n    /* capture:true catches scroll from any container, not just the window */\n    document.addEventListener('scroll', this.onScroll, { capture: true, passive: true });\n    window.addEventListener('resize', this.onScroll, { passive: true });\n    this.onScroll();\n\n    this.onKey = (e) => {\n      if (e.key !== 'Escape') return;\n      if (this.state.lb) this.closeLightbox();\n      else if (this.state.project) this.closeProject();\n      else if (this.state.menuOpen) this.setState({ menuOpen: false });\n    };\n    window.addEventListener('keydown', this.onKey);\n\n    this.initCursor();\n    this.initReveal();\n    this.initSliders();\n    this.initImages();\n  }\n\n  componentDidUpdate() {\n    this.initSliders();\n    this.initReveal();\n    this.initImages();\n    this.syncLightbox();\n  }\n\n  /* Assign src for plain-markup case-study stills after hydration. */\n  initImages() {\n    document.querySelectorAll('[data-img]').forEach(img => {\n      if (img.dataset.imgSet) return;\n      img.dataset.imgSet = '1';\n      img.onerror = () => { img.style.visibility = 'hidden'; };\n      img.src = this.csImg[img.dataset.img] || '';\n    });\n  }\n\n  syncLightbox() {\n    const lb = this.state.lb;\n    const img = this.lbImgRef.current;\n    const vid = this.lbVideoRef.current;\n    const frame = this.lbFrameRef.current;\n    if (img) {\n      const want = lb && lb.type === 'image' ? lb.src : '';\n      if (want) { if (img.getAttribute('src') !== want) img.src = want; }\n      else img.removeAttribute('src');\n    }\n    if (vid) {\n      const want = lb && lb.type === 'file' ? lb.src : '';\n      if (want) {\n        if (vid.getAttribute('src') !== want) { vid.src = want; const p = vid.play(); if (p && p.catch) p.catch(() => {}); }\n      } else { vid.pause(); vid.removeAttribute('src'); }\n    }\n    if (frame) {\n      const want = lb && lb.type === 'video' ? lb.src : '';\n      if (want) { if (frame.getAttribute('src') !== want) frame.src = want; }\n      else frame.removeAttribute('src');\n    }\n  }\n\n  componentWillUnmount() {\n    if (this.mq) this.mq.removeEventListener('change', this.onMQ);\n    document.removeEventListener('scroll', this.onScroll, { capture: true });\n    window.removeEventListener('resize', this.onScroll);\n    window.removeEventListener('keydown', this.onKey);\n    if (this.io) this.io.disconnect();\n    if (this.moveHandler) window.removeEventListener('mousemove', this.moveHandler);\n    document.documentElement.removeAttribute('data-cursor');\n  }\n\n  /* The page may scroll on <body> (component host) or on the document — support both. */\n  scroller() {\n    const b = document.body;\n    if (b.scrollHeight > b.clientHeight + 2 && getComputedStyle(b).overflowY !== 'visible') return b;\n    return document.scrollingElement || document.documentElement;\n  }\n\n  /* Measured off the page itself, so it is correct whichever element actually scrolls. */\n  scrollY() {\n    const page = document.getElementById('top');\n    if (page) return Math.max(0, -page.getBoundingClientRect().top);\n    const sc = this.scroller();\n    return sc === document.body ? sc.scrollTop : (window.scrollY || sc.scrollTop || 0);\n  }\n\n  /* ---------- theme ---------- */\n  applyTheme(theme) {\n    document.documentElement.setAttribute('data-theme', theme);\n    this.setState({ theme });\n    try { localStorage.setItem('mvd-theme', theme); } catch (e) {}\n  }\n\n  applyAccent() {\n    const c = this.props.accentColor;\n    if (c) document.documentElement.style.setProperty('--accent-color', c);\n  }\n\n  /* ---------- custom cursor ---------- */\n  initCursor() {\n    const el = document.getElementById('mvd-cursor');\n    if (!el) return;\n    const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;\n    const wanted = this.props.customCursor !== false;\n    if (!fine || !wanted) { el.style.display = 'none'; return; }\n    document.documentElement.setAttribute('data-cursor', 'on');\n    let x = 0, y = 0, raf = null;\n    const sel = 'a,button,[data-ba],[role=\"slider\"]';\n    this.moveHandler = (e) => {\n      x = e.clientX; y = e.clientY;\n      const hot = e.target instanceof Element && e.target.closest(sel);\n      if (raf) return;\n      raf = requestAnimationFrame(() => {\n        raf = null;\n        el.style.opacity = '1';\n        el.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0) translate(-50%,-50%)';\n        if (hot) {\n          el.style.width = '46px'; el.style.height = '46px';\n          el.style.background = 'rgba(56,161,255,.10)';\n          el.style.border = '1px solid var(--accent-color)';\n        } else {\n          el.style.width = '8px'; el.style.height = '8px';\n          el.style.background = 'var(--accent-color)';\n          el.style.border = '0';\n        }\n      });\n    };\n    window.addEventListener('mousemove', this.moveHandler, { passive: true });\n  }\n\n  /* ---------- scroll reveal ---------- */\n  initReveal() {\n    if (this.props.revealOnScroll === false) return;\n    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    if (!this.io) {\n      this.io = new IntersectionObserver((entries) => {\n        this.ioAlive = true;\n        entries.forEach(en => {\n          if (en.isIntersecting || en.boundingClientRect.top < 0) {\n            en.target.classList.add('shown');\n            this.io.unobserve(en.target);\n          }\n        });\n      }, { rootMargin: '0px 0px -6% 0px', threshold: 0.02 });\n    }\n    document.querySelectorAll('[data-reveal]').forEach(el => {\n      if (el.dataset.revealInit) return;\n      el.dataset.revealInit = '1';\n      el.classList.add('armed');\n      this.io.observe(el);\n    });\n    this.sweepReveal();\n    /* Failsafe: never leave content hidden — after a moment everything is shown regardless\n       of scroll plumbing (embeds, print, unusual hosts). */\n    clearTimeout(this.revealFailsafe);\n    this.revealFailsafe = setTimeout(() => {\n      if (this.ioAlive || this.sawScroll) return;\n      document.querySelectorAll('[data-reveal]').forEach(e => e.classList.add('shown'));\n    }, 2500);\n  }\n\n  /* Reveal anything at or above the fold — works for smooth scroll and anchor jumps alike. */\n  sweepReveal() {\n    const pending = document.querySelectorAll('[data-reveal].armed:not(.shown)');\n    if (!pending.length) return;\n    const h = window.innerHeight;\n    pending.forEach(el => {\n      const r = el.getBoundingClientRect();\n      if (r.top < h * 0.92) el.classList.add('shown');\n    });\n  }\n\n  /* ---------- before / after sliders ---------- */\n  initSliders() {\n    document.querySelectorAll('[data-ba]').forEach(c => {\n      if (c.dataset.baInit) return;\n      c.dataset.baInit = '1';\n      const top = c.querySelector('[data-ba-top]');\n      const handle = c.querySelector('[data-ba-handle]');\n      if (!top || !handle) return;\n      let pct = 50;\n      const set = (p) => {\n        pct = Math.max(0, Math.min(100, p));\n        top.style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';\n        handle.style.left = pct + '%';\n        c.setAttribute('aria-valuenow', String(Math.round(pct)));\n      };\n      const fromX = (clientX) => {\n        const r = c.getBoundingClientRect();\n        set(((clientX - r.left) / r.width) * 100);\n      };\n      c.addEventListener('pointerdown', (e) => {\n        c.setPointerCapture(e.pointerId);\n        fromX(e.clientX);\n      });\n      c.addEventListener('pointermove', (e) => {\n        if (!c.hasPointerCapture(e.pointerId)) return;\n        fromX(e.clientX);\n      });\n      c.addEventListener('pointerup', (e) => {\n        if (c.hasPointerCapture(e.pointerId)) c.releasePointerCapture(e.pointerId);\n      });\n      c.addEventListener('keydown', (e) => {\n        if (e.key === 'ArrowLeft') { set(pct - 4); e.preventDefault(); }\n        if (e.key === 'ArrowRight') { set(pct + 4); e.preventDefault(); }\n        if (e.key === 'Home') { set(0); e.preventDefault(); }\n        if (e.key === 'End') { set(100); e.preventDefault(); }\n      });\n      set(50);\n    });\n  }\n\n  lockScroll(on) {\n    document.body.style.overflow = on ? 'hidden' : '';\n  }\n\n  /* ---------- render ---------- */\n  renderVals() {\n    const s = this.state;\n    const soonMap = {\n      melodyssey: { title: 'Melodyssey', sub: 'Audio-Visual Odyssey', slot: 'assets/melodyssey-cover.jpg' },\n      like2like: { title: 'Like 2 Like', sub: 'Project — Coming Soon', slot: 'assets/like2like-cover.jpg' },\n      colorburst: { title: 'Color Burst Fury', sub: 'Project — Coming Soon', slot: 'assets/colorburstfury-cover.jpg' }\n    };\n    const soon = soonMap[s.project];\n    const lb = s.lb;\n\n    return {\n      year: new Date().getFullYear(),\n      isDark: s.theme === 'dark',\n      isLight: s.theme !== 'dark',\n      moonOpacity: s.theme === 'dark' ? 0 : 1,\n      moonShift: s.theme === 'dark' ? 'translateX(-140%)' : 'translateX(0)',\n      sunOpacity: s.theme === 'dark' ? 1 : 0,\n      sunShift: s.theme === 'dark' ? 'translateX(0)' : 'translateX(140%)',\n      menuIcon: s.menuOpen ? '\\u2715' : '\\u2630',\n      menuOpen: s.menuOpen,\n      isMobile: s.isMobile,\n      isDesktop: !s.isMobile,\n\n      clients: this.clients,\n      posters: this.posters,\n      projects: this.projects,\n      bas: this.bas,\n      loops: this.loops,\n      tiles: this.tiles,\n\n      reelA: s.reelA,\n      reelB: s.reelB,\n      reelAIdle: !s.reelA,\n      reelBIdle: !s.reelB,\n\n      modalHidden: !s.project,\n      modalOpacity: s.project ? 1 : 0,\n      modalPointer: s.project ? 'all' : 'none',\n      modalClip: s.project ? 'circle(150% at 50% 50%)' : 'circle(0% at 50% 50%)',\n      hideUmami: s.project !== 'umami',\n      hideMooning: s.project !== 'mooning',\n      hideShattered: s.project !== 'shattered',\n      hideSoon: !soon,\n      soonTitle: soon ? soon.title : '',\n      soonSub: soon ? soon.sub : '',\n      soonSlot: soon ? soon.slot : '',\n\n      lbHidden: !lb,\n      lbOpacity: lb ? 1 : 0,\n      lbPointer: lb ? 'all' : 'none',\n      lbIsVideo: !!lb && lb.type === 'video',\n      lbIsImage: !!lb && lb.type === 'image',\n      lbIsFile: !!lb && lb.type === 'file',\n      lbSrc: lb ? lb.src : '',\n      lbTitle: lb ? lb.title : '',\n\n      lbImgRef: this.lbImgRef,\n      lbVideoRef: this.lbVideoRef,\n      lbFrameRef: this.lbFrameRef,\n      progressRef: this.progressRef,\n      topRef: this.topRef,\n      modalRef: this.modalRef,\n\n      toggleTheme: () => this.applyTheme(this.state.theme === 'dark' ? 'light' : 'dark'),\n      toggleMenu: () => this.setState(st => ({ menuOpen: !st.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      scrollTop: () => { try { this.scroller().scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { this.scroller().scrollTop = 0; } },\n      onMediaError: (e) => {\n        e.target.style.display = 'none';\n        const n = e.target.nextElementSibling;\n        if (n && n.dataset && n.dataset.fallback) n.style.display = 'flex';\n      },\n      playReel: (e) => {\n        const which = e.currentTarget.dataset.reel;\n        this.setState(which === 'A' ? { reelA: true } : { reelB: true });\n      },\n      openProject: (e) => {\n        this.setState({ project: e.currentTarget.dataset.project, menuOpen: false });\n        this.lockScroll(true);\n        requestAnimationFrame(() => { if (this.modalRef.current) this.modalRef.current.scrollTop = 0; });\n      },\n      closeProject: () => {\n        this.setState({ project: null });\n        this.lockScroll(false);\n      },\n      openVideo: (e) => {\n        const d = e.currentTarget.dataset;\n        this.setState({ lb: { type: 'video', src: 'https://www.youtube-nocookie.com/embed/' + d.yt + '?autoplay=1&rel=0&loop=1&playlist=' + d.yt, title: d.title } });\n      },\n      openTile: (e) => {\n        const t = this.tiles[Number(e.currentTarget.dataset.tile)];\n        if (!t) return;\n        this.setState({ lb: { type: t.kind === 'video' ? 'file' : 'image', src: t.src, title: t.title || t.src } });\n      },\n      closeLightbox: () => this.setState({ lb: null })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
