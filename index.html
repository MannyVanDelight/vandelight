  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tyle-hover=\"color:var(--accent-color)\">Projects<\u002Fa><\u002Fli>\n          <li><a href=\"#before-after\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Cormorant Garamond',serif;font-size:.95rem;text-transform:uppercase;letter-spacing:3px;color:var(--text-main)\" style-hover=\"color:var(--accent-color)\">Before &amp; Afters<\u002Fa><\u002Fli>\n          <li><a href=\"#client-work\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Cormorant Garamond',serif;font-size:.95rem;text-transform:uppercase;letter-spacing:3px;color:var(--text-main)\" style-hover=\"color:var(--accent-color)\">Client Work<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fnav>\n    <\u002Fsc-if>\n\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle light or dark theme\" title=\"Toggle light / dark\" style=\"width:34px;height:34px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--border-color);background:var(--surface-color);color:var(--text-main);font-size:.95rem;line-height:1;padding:0;transition:border-color .3s,transform .3s\" style-hover=\"border-color:var(--accent-color);transform:rotate(-18deg)\"><span style=\"position:relative;display:block;width:16px;height:16px;overflow:hidden\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position:absolute;top:0;left:0;transition:transform .4s cubic-bezier(.19,1,.22,1),opacity .3s ease;opacity:{{ moonOpacity }};transform:{{ moonShift }}\"><path d=\"M20.5 14.8A8.6 8.6 0 0 1 9.2 3.5 8 8 0 1 0 20.5 14.8Z\"><\u002Fpath><\u002Fsvg>\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"position:absolute;top:0;left:0;transition:transform .4s cubic-bezier(.19,1,.22,1),opacity .3s ease;opacity:{{ sunOpacity }};transform:{{ sunShift }}\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fspan><\u002Fbutton>\n\n    <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Toggle navigation\" style=\"background:none;border:0;color:var(--text-main);font-size:1.35rem;line-height:1;padding:.15rem;flex-shrink:0\">{{ menuIcon }}<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <nav style=\"position:fixed;top:0;right:0;width:82%;max-width:320px;height:100vh;background:var(--bg-color);border-left:1px solid var(--border-color);padding:5.5rem 2rem 2rem;box-shadow:-10px 0 40px rgba(0,0,0,.18);z-index:105;overflow-y:auto\">\n      <ul style=\"display:flex;flex-direction:column;align-items:flex-start;gap:1.75rem;list-style:none\">\n        <li><a href=\"#about\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Cormorant Garamond',serif;font-size:1.2rem;text-transform:uppercase;letter-spacing:3px;color:var(--text-main)\">About<\u002Fa><\u002Fli>\n        <li><a href=\"#projects\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Cormorant Garamond',serif;font-size:1.2rem;text-transform:uppercase;letter-spacing:3px;color:var(--text-main)\">Projects<\u002Fa><\u002Fli>\n        <li><a href=\"#before-after\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Cormorant Garamond',serif;font-size:1.2rem;text-transform:uppercase;letter-spacing:3px;color:var(--text-main)\">Before &amp; Afters<\u002Fa><\u002Fli>\n        <li><a href=\"#client-work\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"font-family:'Cormorant Garamond',serif;font-size:1.2rem;text-transform:uppercase;letter-spacing:3px;color:var(--text-main)\">Client Work<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fnav>\n  <\u002Fsc-if>\n<\u002Fheader>\n\n<main id=\"top\">\n  <section id=\"about\" data-screen-label=\"About\" style=\"max-width:1400px;margin:0 auto;padding:9rem clamp(1.25rem,4vw,3rem) 3rem;scroll-margin-top:80px\">\n    <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:.85rem;letter-spacing:4px;text-transform:uppercase;color:var(--accent-color);font-weight:500;margin-bottom:1rem\">Visual Alchemist &amp; Creative Director<\u002Fspan>\n    <h1 style=\"font-size:clamp(2.8rem,8vw,7rem);font-weight:400;line-height:1.05;font-style:italic;margin-bottom:1.75rem\">Manny Van Delight<\u002Fh1>\n\n    <p style=\"font-size:clamp(1.5rem,3.2vw,2.1rem);font-style:italic;color:var(--text-main);margin-bottom:2rem\">Did I do well mum?<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2.5rem clamp(2rem,4vw,4rem);max-width:1150px;margin-bottom:4.5rem\">\n      <div>\n        <p style=\"font-size:1.35rem;line-height:1.55;color:var(--text-main);margin-bottom:1.4rem;text-wrap:pretty\">A creative rascal. A world-builder. A storyteller who turns distant lands and bold ideas into engaging art. Guided by my inner child as my true north, I fuse photography, film, and visual effects magic into powerful, immersive experiences.<\u002Fp>\n        <p style=\"font-size:1.1rem;line-height:1.7;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">For decades, I crafted visuals for the world's biggest brands — Audi, Porsche, Toyota — and contributed to films like Avatar, Tintin, Wonder Woman, Tomb Raider, and games like Horizon Zero Dawn. But beyond the industry, I found my true passion: creating my own art, where storytelling and technology collide.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p style=\"font-size:1.1rem;line-height:1.7;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Now, I'm pushing the boundaries of interactive filmmaking — blending visuals, narrative, and cutting-edge tech to create stories where the audience plays a role. My work isn't just something to watch; it's something to experience and shape. Through community-driven storytelling, I invite people to vote and influence the narrative, making them an integral part of the creative process.<\u002Fp>\n        <p style=\"font-size:1.1rem;line-height:1.7;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">And while I continue to carve my own path, I'm also working on one of the biggest movies out there — though I can't reveal what it is just yet. Every share, every kind word, every purchase fuels this journey and for that, you have our deepest gratitude.<\u002Fp>\n        <p style=\"font-family:'Montserrat',sans-serif;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color)\">— MvD<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:2.5rem;margin-bottom:5rem\">\n      <div>\n        <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem\">Fvck'n Mondays<\u002Fspan>\n        <div style=\"width:100%;aspect-ratio:16/9;border:1px solid var(--border-color);border-radius:4px;overflow:hidden;background:var(--surface-color);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.06)\">\n          <sc-if value=\"{{ reelA }}\" hint-placeholder-val=\"{{ false }}\">\n            <iframe src=\"https://www.youtube-nocookie.com/embed/H-IdvMM3Ng4?autoplay=1&amp;rel=0\" title=\"Fvck'n Mondays\" allow=\"autoplay; encrypted-media; fullscreen; picture-in-picture\" allowfullscreen=\"allowfullscreen\" style=\"width:100%;height:100%;border:0;display:block\"><\u002Fiframe>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ reelAIdle }}\" hint-placeholder-val=\"{{ true }}\">\n            <button data-reel=\"A\" sc-camel-on-click=\"{{ playReel }}\" aria-label=\"Play Fvck'n Mondays\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:#000;display:block;overflow:hidden\">\n              <img src=\"280c2073-ece3-44f9-9b84-370bec04a7a8\" alt=\"\" loading=\"lazy\" decoding=\"async\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"width:100%;height:100%;object-fit:cover;opacity:.82;transition:opacity .4s,transform .6s\">\n              <span style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;padding-left:5px;backdrop-filter:blur(2px)\">▶<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem\">Allround VFX Reel<\u002Fspan>\n        <div style=\"width:100%;aspect-ratio:16/9;border:1px solid var(--border-color);border-radius:4px;overflow:hidden;background:var(--surface-color);position:relative;box-shadow:0 10px 30px rgba(0,0,0,.06)\">\n          <sc-if value=\"{{ reelB }}\" hint-placeholder-val=\"{{ false }}\">\n            <iframe src=\"https://www.youtube-nocookie.com/embed/vqJQTj1UP08?autoplay=1&amp;rel=0\" title=\"Allround VFX Reel\" allow=\"autoplay; encrypted-media; fullscreen; picture-in-picture\" allowfullscreen=\"allowfullscreen\" style=\"width:100%;height:100%;border:0;display:block\"><\u002Fiframe>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ reelBIdle }}\" hint-placeholder-val=\"{{ true }}\">\n            <button data-reel=\"B\" sc-camel-on-click=\"{{ playReel }}\" aria-label=\"Play Allround VFX Reel\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:#000;display:block;overflow:hidden\">\n              <img src=\"5b85ffa7-8ab1-4d02-8b0a-cbf88e58ac82\" alt=\"\" loading=\"lazy\" decoding=\"async\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"width:100%;height:100%;object-fit:cover;opacity:.82;transition:opacity .4s,transform .6s\">\n              <span style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;padding-left:5px;backdrop-filter:blur(2px)\">▶<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\" style=\"max-width:900px;margin:0 auto 5rem\">\n      <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.5rem;text-align:center\">Selected Key Clients<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:1rem\">\n        <sc-for list=\"{{ clients }}\" as=\"client\" hint-placeholder-count=\"12\">\n          <div style=\"width:96px;aspect-ratio:1/1;background:#1A1A1A;border:1px solid rgba(255,255,255,.12);border-radius:4px;display:flex;align-items:center;justify-content:center;padding:.6rem;transition:border-color .3s\" style-hover=\"border-color:var(--accent-color)\">\n            <img src=\"{{ client.src }}\" alt=\"{{ client.name }}\" loading=\"lazy\" decoding=\"async\" width=\"72\" height=\"72\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"max-width:72px;max-height:72px;width:auto;height:auto;object-fit:contain;filter:grayscale(100%);opacity:.7;transition:filter .3s,opacity .3s\" style-hover=\"filter:grayscale(0%);opacity:1\">\n            <span data-fallback=\"1\" style=\"display:none;font-family:'Montserrat',sans-serif;font-size:.52rem;letter-spacing:1px;text-transform:uppercase;color:#8A8A8A;text-align:center;line-height:1.3\">{{ client.name }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"1\">\n      <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1.5rem\">Featured Film &amp; Game Posters<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:clamp(.7rem,1.6vw,1.5rem)\">\n        <sc-for list=\"{{ posters }}\" as=\"poster\" hint-placeholder-count=\"6\">\n          <div style=\"position:relative;aspect-ratio:2/3;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 8px,var(--stripe-b) 8px 16px);border:1px solid var(--border-color);border-radius:4px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.05);transition:transform .4s,border-color .4s\" style-hover=\"transform:translateY(-6px);border-color:var(--accent-color)\">\n            <span style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:.5rem;font-family:ui-monospace,monospace;font-size:.55rem;line-height:1.5;letter-spacing:.5px;color:var(--text-muted);text-align:center\">{{ poster.slot }}<\u002Fspan>\n            <img src=\"{{ poster.src }}\" alt=\"{{ poster.name }}\" loading=\"lazy\" decoding=\"async\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"projects\" data-screen-label=\"Projects\" data-reveal=\"1\" style=\"max-width:1400px;margin:0 auto;padding:6rem clamp(1.25rem,4vw,3rem);scroll-margin-top:80px\">\n    <h2 style=\"font-size:clamp(2.2rem,5vw,3rem);font-weight:400;margin-bottom:3rem;border-bottom:1px solid var(--border-color);padding-bottom:1rem\">Projects<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:clamp(1.25rem,2.5vw,2.5rem)\">\n      <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <button data-project=\"{{ p.id }}\" sc-camel-on-click=\"{{ openProject }}\" aria-label=\"{{ p.aria }}\" style=\"position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--border-color);background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px);display:flex;align-items:flex-end;padding:1.75rem;text-align:left;box-shadow:0 4px 20px rgba(0,0,0,.04);transition:transform .5s cubic-bezier(.19,1,.22,1),box-shadow .5s,border-color .5s\" style-hover=\"transform:scale(.985);border-color:var(--accent-color);box-shadow:0 12px 40px rgba(56,161,255,.16)\">\n          <span style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.5px;color:var(--text-muted);text-align:center\">{{ p.slot }}<\u002Fspan>\n          <img src=\"{{ p.cover }}\" alt=\"\" loading=\"lazy\" decoding=\"async\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n          <span style=\"position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(0,0,0,.78),transparent)\"><\u002Fspan>\n          <span style=\"position:relative;z-index:2;color:#FFFFFF;width:100%\">\n            <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,2.3vw,2.3rem);line-height:1.1;margin-bottom:.4rem\">{{ p.title }}<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:2px;text-transform:uppercase;opacity:.92\">{{ p.sub }}<span style=\"border:1px solid rgba(255,255,255,.55);border-radius:20px;padding:.15rem .5rem;font-size:.58rem;letter-spacing:1.5px\">{{ p.badge }}<\u002Fspan><\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"before-after\" data-screen-label=\"Before and afters\" data-reveal=\"1\" style=\"max-width:1400px;margin:0 auto;padding:6rem clamp(1.25rem,4vw,3rem);scroll-margin-top:80px\">\n    <h2 style=\"font-size:clamp(2.2rem,5vw,3rem);font-weight:400;margin-bottom:1rem;border-bottom:1px solid var(--border-color);padding-bottom:1rem\">Before And Afters<\u002Fh2>\n    <p style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:3rem\">Drag the handle — or focus a frame and use the arrow keys<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(1.5rem,3vw,2.5rem)\">\n      <sc-for list=\"{{ bas }}\" as=\"ba\" hint-placeholder-count=\"4\">\n        <div>\n          <div data-ba=\"1\" tabindex=\"0\" role=\"slider\" aria-label=\"{{ ba.title }} before and after comparison\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"50\" style=\"position:relative;width:100%;aspect-ratio:6/4;overflow:hidden;border:1px solid var(--border-color);border-radius:4px;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px);user-select:none;touch-action:pan-y;box-shadow:0 4px 20px rgba(0,0,0,.04);transition:border-color .4s\" style-hover=\"border-color:var(--accent-color)\">\n            <img src=\"{{ ba.after }}\" alt=\"{{ ba.title }} after\" loading=\"lazy\" decoding=\"async\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n            <img data-ba-top=\"1\" src=\"{{ ba.before }}\" alt=\"{{ ba.title }} before\" loading=\"lazy\" decoding=\"async\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;clip-path:inset(0 50% 0 0)\">\n            <span style=\"position:absolute;top:.9rem;left:.9rem;font-family:'Montserrat',sans-serif;font-size:.6rem;letter-spacing:2px;text-transform:uppercase;background:rgba(0,0,0,.6);color:#FFF;padding:.25rem .7rem;border-radius:20px;z-index:4;pointer-events:none\">Before<\u002Fspan>\n            <span style=\"position:absolute;top:.9rem;right:.9rem;font-family:'Montserrat',sans-serif;font-size:.6rem;letter-spacing:2px;text-transform:uppercase;background:rgba(0,0,0,.6);color:#FFF;padding:.25rem .7rem;border-radius:20px;z-index:4;pointer-events:none\">After<\u002Fspan>\n            <span data-ba-handle=\"1\" style=\"position:absolute;top:0;bottom:0;left:50%;width:2px;background:#FFFFFF;z-index:5;transform:translateX(-50%);box-shadow:0 0 10px rgba(0,0,0,.35);pointer-events:none\">\n              <span style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#FFFFFF;border:2px solid var(--accent-color);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(0,0,0,.2);color:var(--accent-color);font-size:.7rem\">❮❯<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:.9rem\">\n            <h3 style=\"font-size:clamp(1.1rem,2vw,1.7rem);font-weight:400;line-height:1.2\">{{ ba.title }}<\u002Fh3>\n            <p style=\"font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted)\">{{ ba.sub }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"client-work\" data-screen-label=\"Client work\" data-reveal=\"1\" style=\"max-width:1400px;margin:0 auto;padding:6rem clamp(1.25rem,4vw,3rem);scroll-margin-top:80px\">\n    <h2 style=\"font-size:clamp(2.2rem,5vw,3rem);font-weight:400;margin-bottom:1rem;border-bottom:1px solid var(--border-color);padding-bottom:1rem\">Client Work<\u002Fh2>\n    <p style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:3rem\">Selected frames, films and campaign work — click any tile to enlarge<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));grid-auto-rows:clamp(140px,15vw,200px);gap:clamp(.6rem,1.4vw,1.1rem)\">\n      <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"9\">\n        <button data-tile=\"{{ t.index }}\" sc-camel-on-click=\"{{ openTile }}\" aria-label=\"{{ t.aria }}\" style=\"position:relative;overflow:hidden;border:1px solid var(--border-color);border-radius:3px;padding:0;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px);grid-column:{{ t.col }};grid-row:{{ t.row }};transition:border-color .4s,box-shadow .4s\" style-hover=\"border-color:var(--accent-color);box-shadow:0 10px 34px rgba(56,161,255,.15)\">\n          <span style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:1rem;font-family:ui-monospace,monospace;font-size:.6rem;letter-spacing:.5px;color:var(--text-muted);text-align:center;line-height:1.6\">{{ t.slot }}<span style=\"font-size:.52rem;opacity:.75\">{{ t.kindLabel }}<\u002Fspan><\u002Fspan>\n          <img src=\"{{ t.thumb }}\" alt=\"\" loading=\"lazy\" decoding=\"async\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.19,1,.22,1)\" style-hover=\"transform:scale(1.04)\">\n          <span hidden=\"{{ t.noTitle }}\" style=\"position:absolute;left:0;right:0;bottom:0;height:65%;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);opacity:.95;pointer-events:none\"><\u002Fspan>\n          <span style=\"position:absolute;left:0;right:0;bottom:0;z-index:2;padding:1rem;display:flex;align-items:flex-end;justify-content:space-between;gap:.75rem;text-align:left;pointer-events:none\">\n            <span>\n              <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.2;color:#FFFFFF\">{{ t.title }}<\u002Fspan>\n              <span style=\"display:block;font-family:'Montserrat',sans-serif;font-size:.6rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:.2rem\">{{ t.sub }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-size:.65rem;padding-left:2px\">{{ t.glyph }}<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:#101010;color:#F7F7F5;padding:7rem 0 3rem;margin-top:6rem\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(1.25rem,4vw,3rem)\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:3rem;padding-bottom:5rem;border-bottom:1px solid rgba(255,255,255,.1)\">\n      <div style=\"grid-column:1/-1;max-width:520px\">\n        <h2 style=\"font-size:clamp(2.2rem,5vw,3.4rem);font-weight:400;font-style:italic;margin-bottom:1.25rem\">Manny Van Delight<\u002Fh2>\n        <p style=\"color:#A0A0A0;font-size:1.05rem;line-height:1.65\">Visual Alchemist &amp; Creative Director, bridging impossible visual concepts with precision technical execution.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:.85rem;text-transform:uppercase;letter-spacing:4px;color:var(--accent-color);margin-bottom:1.25rem;font-weight:500\">Navigation<\u002Fdiv>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:.9rem\">\n          <li><a href=\"#about\" style=\"font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#E0E0E0\">About<\u002Fa><\u002Fli>\n          <li><a href=\"#projects\" style=\"font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#E0E0E0\">Projects<\u002Fa><\u002Fli>\n          <li><a href=\"#before-after\" style=\"font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#E0E0E0\">Before &amp; Afters<\u002Fa><\u002Fli>\n          <li><a href=\"#client-work\" style=\"font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#E0E0E0\">Client Work<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:.85rem;text-transform:uppercase;letter-spacing:4px;color:var(--accent-color);margin-bottom:1.25rem;font-weight:500\">Socials<\u002Fdiv>\n        <ul style=\"list-style:none;display:flex;flex-direction:column;gap:.9rem\">\n          <li><a href=\"https://www.instagram.com/mannyvandelight\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#E0E0E0\">Instagram<\u002Fa><\u002Fli>\n          <li><a href=\"https://x.com/MannyVanDelight\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#E0E0E0\">Twitter / X<\u002Fa><\u002Fli>\n          <li><a href=\"https://opensea.io/MannyVanDelight\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#E0E0E0\">OpenSea<\u002Fa><\u002Fli>\n          <li><a href=\"mailto:mannyvandelight@gmail.com\" style=\"font-family:'Cormorant Garamond',serif;font-size:1rem;letter-spacing:2px;text-transform:uppercase;color:#E0E0E0\">Contact<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-top:2.5rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center;font-family:'Montserrat',sans-serif;font-size:.68rem;color:#777777;letter-spacing:2px;text-transform:uppercase\">\n      <div>© {{ year }} Manny Van Delight. All rights reserved.<\u002Fdiv>\n      <div>Crafted with precision.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<button ref=\"{{ topRef }}\" sc-camel-on-click=\"{{ scrollTop }}\" aria-label=\"Back to top\" style=\"position:fixed;bottom:1.75rem;right:1.75rem;width:48px;height:48px;border-radius:50%;background:var(--surface-color);border:1px solid var(--border-color);color:var(--text-main);font-size:1.1rem;display:flex;align-items:center;justify-content:center;z-index:90;opacity:0;visibility:hidden;transform:translateY(20px);transition:all .4s cubic-bezier(.19,1,.22,1);box-shadow:0 4px 20px rgba(0,0,0,.08)\" style-hover=\"background:var(--accent-color);color:#FFFFFF;border-color:var(--accent-color)\">↑<\u002Fbutton>\n\n<div ref=\"{{ modalRef }}\" aria-hidden=\"{{ modalHidden }}\" style=\"position:fixed;top:0;left:0;width:100%;height:100vh;background:var(--bg-color);z-index:200;overflow-y:auto;overflow-x:hidden;opacity:{{ modalOpacity }};pointer-events:{{ modalPointer }};clip-path:{{ modalClip }};transition:clip-path .8s cubic-bezier(.77,0,.175,1),opacity .4s ease\">\n  <button sc-camel-on-click=\"{{ closeProject }}\" style=\"position:fixed;top:1.25rem;right:1.5rem;font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-main);z-index:210;background:var(--surface-color);border:1px solid var(--border-color);padding:.7rem 1.2rem;border-radius:40px;transition:all .3s\" style-hover=\"color:#FFFFFF;background:var(--accent-color);border-color:var(--accent-color)\">[ Close ]<\u002Fbutton>\n\n  <div style=\"max-width:1400px;margin:0 auto;padding:0 clamp(1.25rem,4vw,3rem)\">\n\n    <article hidden=\"{{ hideUmami }}\">\n      <div style=\"padding:7rem 0 2.5rem;text-align:center;border-bottom:1px solid var(--border-color)\">\n        <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:.8rem;letter-spacing:4px;text-transform:uppercase;color:var(--accent-color);margin-bottom:1rem\">The Art of Not Crumbling Under Pressure<\u002Fspan>\n        <h2 style=\"font-size:clamp(2.6rem,7vw,6rem);font-weight:400;font-style:italic\">Umami Origami<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem;margin:2.5rem 0;font-family:'Montserrat',sans-serif;font-size:.82rem;line-height:1.7;color:var(--text-muted);border-bottom:1px solid var(--border-color);padding-bottom:2rem\">\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">About<\u002Fstrong>A high-fashion dress built entirely from paper, shot across real landscapes, with 3D-rendered origami butterflies added in post.<\u002Fdiv>\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">Technique<\u002Fstrong>Handcrafted paper couture, on-location photography, VFX compositing, and one AI-generated companion piece.<\u002Fdiv>\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">Theme<\u002Fstrong>Or, how I metaphorically and literally glued a project together.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width:900px;margin:0 auto;padding-bottom:7rem\">\n        <figure style=\"margin:0 0 2.5rem\">\n          <img data-img=\"uoPath\" alt=\"Path Of Delight\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);display:block;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)\">\n          <figcaption style=\"font-family:'Montserrat',sans-serif;font-size:.75rem;line-height:1.6;color:var(--text-muted);margin-top:.6rem;font-style:italic\">Path Of Delight — all I need is what I see and all I see is in front of me. Only when we venture out, leaving everything behind, do we allow ourselves to discover what we truly need.<\u002Ffigcaption>\n        <\u002Ffigure>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Hello, fellow rascals.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">There is a quiet pressure in the creative world to keep things tidy. To propose concepts that fit neatly into predictable boxes, follow the path of least resistance, and guarantee a smooth, frictionless production. It's safe, it's comfortable, and it is the fastest way to make sure a piece of work leaves absolutely no impression at all.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Personally, I've always found that the most compelling visions live right on the edge of a total logistical collapse.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Today, I'm taking you behind the scenes of my latest project: Umami Origami. It's a project born from a simple, slightly unhinged premise: what happens when you mix high fashion, structural engineering challenges, elegant VFX, a dash of AI, and a severe lack of respect for the weather forecast?<\u002Fp>\n        <p style=\"text-align:center;font-size:1.7rem;font-style:italic;color:var(--accent-color);margin:2.5rem 0\">Spoiler alert: you get magic. But first, you get a lot of stress.<\u002Fp>\n        <div style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:3rem 0 1rem\">The Main Event<\u002Fdiv>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">The concept was simple: craft a high-fashion dress entirely out of paper, shoot it across breathtaking landscapes, and add 3D-rendered origami butterflies in post-production. Easy on paper. Not as straightforward in reality.<\u002Fp>\n        <div style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:3rem 0 1rem\">The Real-World Struggle (IRL Costs Real Money)<\u002Fdiv>\n        <h3 style=\"font-size:1.8rem;font-weight:400;font-style:italic;color:var(--text-main);margin-bottom:1.1rem\">Paper hates the outdoors.<\u002Fh3>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">First of all, finding a dressmaker who doesn't immediately throw scissors at you when you say \"make it out of paper\" is a challenge. Plus it cost a pretty penny to bring to life, and once we got it on set, the universe decided to test my sanity.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem;margin:2.25rem 0\">\n          <div style=\"border-top:1px solid var(--border-color);padding-top:.9rem\"><strong style=\"display:block;font-family:'Montserrat',sans-serif;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-main);margin-bottom:.4rem\">Wind<\u002Fstrong><p style=\"font-size:.95rem;line-height:1.7;color:var(--text-muted)\">Every gentle breeze threatened to violently fold the neck piece into oblivion.<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:1px solid var(--border-color);padding-top:.9rem\"><strong style=\"display:block;font-family:'Montserrat',sans-serif;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-main);margin-bottom:.4rem\">Humidity<\u002Fstrong><p style=\"font-size:.95rem;line-height:1.7;color:var(--text-muted)\">Dampened the paper, making the entire gown heavy, fragile, and prone to melting.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">I had to pull out some serious McGyver moves, reinforcing the structural integrity of the dress mid-shoot while praying to the photography gods it wouldn't show in the final frames. Then there was the model. Bless her soul. Sitting down, moving, or doing literally anything came with a high risk of catastrophic structural failure. But we survived. And the results speak for themselves.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;margin:2rem 0 3rem\">\n          <figure style=\"margin:0\">\n            <img data-img=\"uoAmbling\" alt=\"Ambling Reverie\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);display:block;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)\">\n            <figcaption style=\"font-family:'Montserrat',sans-serif;font-size:.75rem;line-height:1.6;color:var(--text-muted);margin-top:.6rem;font-style:italic\">Ambling Reverie — in the tender embrace of dawn, I meander through whispers of light and shadow.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0\">\n            <img data-img=\"uoSanctuary\" alt=\"Sanctuary\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);display:block;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)\">\n            <figcaption style=\"font-family:'Montserrat',sans-serif;font-size:.75rem;line-height:1.6;color:var(--text-muted);margin-top:.6rem;font-style:italic\">Sanctuary — we are beautiful, we are different, we are attracted to somebody. Often we keep those desires close to heart.<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n        <div style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:3rem 0 1rem\">Cheating Geography via VFX<\u002Fdiv>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">If you look at the locations, you'll notice they span across New Zealand and Australia. Did I fly the whole crew to every remote peak? Absolutely not — I value my bank account.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">For a couple of these concepts I leaned heavily into my visual effects background: shot the locations solo, shot the model separately, and merged her into the environments seamlessly. The 3D-rendered origami butterflies aren't pasted on top; they cast accurate shadows, catch the ambient light, and perfectly mimic the colours of her paper dress. To tie the physical world together, I also captured two shots featuring actual fabric dresses, injecting the digital butterflies to blur the line between the ordinary and the extraordinary.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;margin:2rem 0 3rem\">\n          <figure style=\"margin:0\">\n            <img data-img=\"uoFleeting\" alt=\"Fleeting\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);display:block;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)\">\n            <figcaption style=\"font-family:'Montserrat',sans-serif;font-size:.75rem;line-height:1.6;color:var(--text-muted);margin-top:.6rem;font-style:italic\">Fleeting — a dance between nature and human presence, where the familiar meets the unknown.<\u002Ffigcaption>\n          <\u002Ffigure>\n          <figure style=\"margin:0\">\n            <img data-img=\"uoEchoes\" alt=\"Echoes of Delight\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);display:block;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)\">\n            <figcaption style=\"font-family:'Montserrat',sans-serif;font-size:.75rem;line-height:1.6;color:var(--text-muted);margin-top:.6rem;font-style:italic\">Echoes of Delight — choose joy, and joy will seek you in the crowd. Declare yourself beautiful, and beauty will mirror your form.<\u002Ffigcaption>\n          <\u002Ffigure>\n        <\u002Fdiv>\n        <div style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:3rem 0 1rem\">Enter the Auramancer (The AI Experiment)<\u002Fdiv>\n        <h3 style=\"font-size:1.8rem;font-weight:400;font-style:italic;color:var(--text-main);margin-bottom:1.1rem\">The Gold Dancer.<\u002Fh3>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Because the physical paper dress tried to murder my workflow, I decided to see how the digital gods would handle the pressure. I wanted to design an even more extreme dress for a ballet dancer.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">If you replace \"glass\" with \"gold\" in the word Vitrumancer, you get Auramancer (<em>Aurum<\u002Fem> = Latin for gold, <em>Mancer<\u002Fem> = one with control over an element). A Gold Dancer. Instead of spending weeks and a small fortune on a physical dress that would probably break a dancer's legs, I trained AI on exactly what I wanted. It was the only AI contribution to the project, but it proved a point: for scale, speed, and versatility, embracing the machine let me realize a concept that would otherwise be locked behind a budget wall.<\u002Fp>\n        <figure style=\"margin:2rem auto 3rem;max-width:640px\">\n          <img data-img=\"uoAuramancer\" alt=\"Auramancer — The Gold Dancer\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);display:block;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)\">\n          <figcaption style=\"font-family:'Montserrat',sans-serif;font-size:.75rem;line-height:1.6;color:var(--text-muted);margin-top:.6rem;font-style:italic\">Auramancer — the gold dancer<\u002Ffigcaption>\n        <\u002Ffigure>\n        <div style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:3rem 0 1rem\">The Peak — Midnight Magic<\u002Fdiv>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Midnight Magic delves deep into the myriad emotions and experiences that come with immigrating to a new country. At its heart, it is a visual narrative of transformation, resilience, and growth, as one adapts to new circumstances.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">The art style is divided into distinct elements, each symbolizing a phase of this profound journey. On one hand, there is the night, black and white — the melancholy of leaving one's roots behind, a teary-eyed farewell to family and friends. On the other, the heavy tone is balanced with light-hearted magic: the moon lighting the way, sparkling mist, glowing creatures welcoming us to the new land.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">It's an immigrant's transformative odyssey — cultural shocks, bittersweet nostalgia, the forging of new bonds, and beauty discovered in the most unexpected times. A piece about the universal human experience of migration, and the ever-unfolding tapestry of cultures that make our world so rich.<\u002Fp>\n        <p style=\"text-align:center;font-size:1.6rem;font-style:italic;color:var(--text-main);max-width:700px;margin:3.5rem auto;line-height:1.5\">The best work isn't born in a sterile environment where everything goes according to plan. It's born when the paper dress is tearing, the wind is blowing, the locations are thousands of miles apart, and you are forced to use every tool in your arsenal — from VFX to AI to literal sticky tape — to make the vision reality.<span style=\"display:block;margin-top:1rem;font-family:'Montserrat',sans-serif;font-size:.72rem;font-style:normal;letter-spacing:2px;text-transform:uppercase;color:var(--accent-color)\">I am not afraid to break things to make something beautiful.<\u002Fspan><\u002Fp>\n        <p style=\"text-align:center;font-style:italic;color:var(--text-main)\">Stay delightfully unusual,<br>Manny Van Delight — Creative Director / Visual Alchemist<\u002Fp>\n        <div style=\"text-align:center;margin-top:3.5rem\"><a href=\"https://opensea.io/gallery/MannyVanDelight/deead016ab3b4fe685d51bbecf38c238\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Montserrat',sans-serif;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--accent-color);padding-bottom:3px\">[ Collect on OpenSea ]<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article hidden=\"{{ hideMooning }}\">\n      <div style=\"padding:7rem 0 2.5rem;text-align:center;border-bottom:1px solid var(--border-color)\">\n        <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:.8rem;letter-spacing:4px;text-transform:uppercase;color:var(--accent-color);margin-bottom:1rem\">Animation Loops<\u002Fspan>\n        <h2 style=\"font-size:clamp(2.6rem,7vw,6rem);font-weight:400;font-style:italic\">Mooning The Ignorant<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem;margin:2.5rem 0;font-family:'Montserrat',sans-serif;font-size:.82rem;line-height:1.7;color:var(--text-muted);border-bottom:1px solid var(--border-color);padding-bottom:2rem\">\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">About<\u002Fstrong>Nine looping animations riffing on the quirks, rituals, and copium of the crypto space.<\u002Fdiv>\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">Technique<\u002Fstrong>3D animation loops, built for a wall, minted on-chain.<\u002Fdiv>\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">Theme<\u002Fstrong>Film history and blockchain culture, in the same frame.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width:900px;margin:0 auto;padding-bottom:7rem\">\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">This project is all about the quirks and features of the crypto space — but it also combines that with my actual passion, which is film and filmmaking. Somewhere between a group chat in-joke and a film studies essay, \"Mooning The Ignorant\" was born.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\"><em>When Moon<\u002Fem> is a direct quote and homage to Georges Méliès' iconic 1902 silent sci-fi film <em>A Trip to the Moon<\u002Fem>. Blockchain, much like a rocket in the eye of the moon, is a fairly ridiculous idea that happened anyway — and it acts as the foundation every other piece in this collection stands on.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:2.5rem;text-wrap:pretty\">Nine loops. Watch on repeat, laugh a little, maybe recognize yourself in one or two. No advice given, some feelings implied.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.25rem\">\n          <sc-for list=\"{{ loops }}\" as=\"loop\" hint-placeholder-count=\"9\">\n            <div>\n              <button data-yt=\"{{ loop.yt }}\" data-title=\"{{ loop.title }}\" sc-camel-on-click=\"{{ openVideo }}\" aria-label=\"{{ loop.aria }}\" style=\"position:relative;display:block;width:100%;aspect-ratio:16/9;border:1px solid var(--border-color);border-radius:4px;overflow:hidden;padding:0;background:#000;transition:border-color .3s\" style-hover=\"border-color:var(--accent-color)\">\n                <img src=\"{{ loop.thumb }}\" alt=\"\" loading=\"lazy\" decoding=\"async\" sc-camel-on-error=\"{{ onMediaError }}\" style=\"width:100%;height:100%;object-fit:cover;opacity:.8;transition:opacity .4s,transform .6s\" style-hover=\"opacity:1;transform:scale(1.03)\">\n                <span style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem;padding-left:3px\">▶<\u002Fspan>\n              <\u002Fbutton>\n              <div style=\"font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:.9rem 0 .35rem\">{{ loop.num }} / {{ loop.title }}<\u002Fdiv>\n              <p style=\"font-size:1rem;line-height:1.7;color:var(--text-muted);text-wrap:pretty\">{{ loop.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"text-align:center;margin-top:3.5rem\"><a href=\"https://opensea.io/collection/mooning-the-ignorant\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Montserrat',sans-serif;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--accent-color);padding-bottom:3px\">[ Collect on OpenSea ]<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article hidden=\"{{ hideShattered }}\">\n      <div style=\"padding:7rem 0 2.5rem;text-align:center;border-bottom:1px solid var(--border-color)\">\n        <span style=\"display:block;font-family:'Cormorant Garamond',serif;font-size:.8rem;letter-spacing:4px;text-transform:uppercase;color:var(--accent-color);margin-bottom:1rem\">Interactive Filmmaking &amp; Community Worldbuilding<\u002Fspan>\n        <h2 style=\"font-size:clamp(2.6rem,7vw,6rem);font-weight:400;font-style:italic\">Shattered Dawn<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem;margin:2.5rem 0;font-family:'Montserrat',sans-serif;font-size:.82rem;line-height:1.7;color:var(--text-muted);border-bottom:1px solid var(--border-color);padding-bottom:2rem\">\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">About<\u002Fstrong>An interactive sci-fi universe where the audience steps into the director's chair to vote, shape the plot, and forge the destiny of our heroine, Layla.<\u002Fdiv>\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">Technique<\u002Fstrong>Cinematic VFX compositing, AI concept art wrestling, 3D prop modeling, interactive polling, and Bitcoin Ordinals integration.<\u002Fdiv>\n        <div><strong style=\"display:block;color:var(--accent-color);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:2px;font-size:.7rem\">Theme<\u002Fstrong>Who needs a predictable Hollywood script when you can hand the steering wheel to a horde of passionate internet rascals?<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width:900px;margin:0 auto;padding-bottom:7rem\">\n        <figure style=\"margin:0 0 2.5rem\">\n          <img data-img=\"sdHero\" alt=\"Shattered Dawn key visual\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;border:1px solid var(--border-color);display:block;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 9px,var(--stripe-b) 9px 18px)\">\n          <figcaption style=\"font-family:'Montserrat',sans-serif;font-size:.75rem;line-height:1.6;color:var(--text-muted);margin-top:.6rem;font-style:italic\">Shattered Dawn — where cinema, community choice, and digital lore collide. The audience decides who survives, what gets built, and where the story goes next.<\u002Ffigcaption>\n        <\u002Ffigure>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Listen up, fellow rascals.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">For decades, traditional filmmaking has treated audiences like passive passengers: you sit in a dark room, eat your overpriced popcorn, and watch whatever pre-packaged story a studio executive greenlit three years ago. If a character makes a mind-bogglingly bad decision, you scream at the screen, but nothing changes.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">I got tired of yelling at the screen. So I thought: <em>What happens if we hand the steering wheel directly to the audience?<\u002Fem><\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Welcome to <strong style=\"color:var(--text-main);font-weight:600\">Shattered Dawn<\u002Fstrong> — my ongoing sandbox experiment in interactive, community-driven sci-fi filmmaking. It is equal parts cinematic worldbuilding, high-stakes visual effects, relentless AI prompting battles, and raw community democracy.<\u002Fp>\n        <p style=\"text-align:center;font-size:1.7rem;font-style:italic;color:var(--accent-color);margin:2.5rem 0\">No safety net. No script. Just Layla, the crowd, and whatever chaos we vote into existence.<\u002Fp>\n        <div style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:3rem 0 1rem\">The Core Premise — Vote Your Heroine<\u002Fdiv>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">At its heart, <em>Shattered Dawn<\u002Fem> follows our protagonist, Layla, as she navigates a treacherous dystopian world filled with toxic atmosphere, illegal technology, and rogue factions. But here's the twist: <strong style=\"color:var(--text-main);font-weight:600\">you call the shots<\u002Fstrong>.<\u002Fp>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Through community voting rounds, fans dictate critical narrative forks: from Layla's tactical maneuvers and alliance allegiances down to the literal gear and weapons she crafts to survive. Every single vote bends the trajectory of the storyline, turning story creation into a real-time multiplayer experience.<\u002Fp>\n        <div style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:3rem 0 1rem\">Wrestling the Digital Gods (VFX + AI Chaos)<\u002Fdiv>\n        <h3 style=\"font-size:1.8rem;font-weight:400;font-style:italic;color:var(--text-main);margin-bottom:1.1rem\">When MidJourney decides every prompt is a suggestion, not an instruction.<\u002Fh3>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">Bringing a community-voted story to life at feature-film visual standards in real-time is a glorious, chaotic challenge. Case in point: when the community voted on designing \"The Extractor\" — a crucial piece of high-tech gear for Layla — I turned to AI tools to iterate fast concepts.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.5rem;margin:2.25rem 0\">\n          <div style=\"border-top:1px solid var(--border-color);padding-top:.9rem\"><strong style=\"display:block;font-family:'Montserrat',sans-serif;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-main);margin-bottom:.4rem\">Prompting Mayhem<\u002Fstrong><p style=\"font-size:.95rem;line-height:1.7;color:var(--text-muted)\">MidJourney kept hallucinating sci-fi space-toasters and alien vacuum cleaners instead of sleek extraction tools.<\u002Fp><\u002Fdiv>\n          <div style=\"border-top:1px solid var(--border-color);padding-top:.9rem\"><strong style=\"display:block;font-family:'Montserrat',sans-serif;font-size:.75rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-main);margin-bottom:.4rem\">VFX Refinement<\u002Fstrong><p style=\"font-size:.95rem;line-height:1.7;color:var(--text-muted)\">Taking raw concepts into 3D software and Photoshop to carve out crisp, vote-ready assets fitting cinematic standards.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">I ended up pulling back the curtain in behind-the-scenes vlogs, showing the unvarnished battle between human creative direction and artificial intelligence gone rogue until we achieved three clean options for the community poll. That's the heartbeat of this project: it's transparent, unpredictable, and delightfully unhinged.<\u002Fp>\n        <div style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:3px;text-transform:uppercase;color:var(--accent-color);font-weight:600;margin:3rem 0 1rem\">On-Chain Lore &amp; Interactive Ordinals<\u002Fdiv>\n        <p style=\"font-size:1.12rem;line-height:1.8;color:var(--text-muted);margin-bottom:1.4rem;text-wrap:pretty\">To take co-creation even deeper, <em>Shattered Dawn<\u002Fem> weaves interactive digital collectibles and Bitcoin Ordinals into the mix. Owning a piece of the universe isn't just about holding digital art; it acts as a pass to influence key story arcs and lock your mark into the official canon forever.<\u002Fp>\n        <p style=\"text-align:center;font-size:1.6rem;font-style:italic;color:var(--text-main);max-width:700px;margin:3.5rem auto;line-height:1.5\">Shattered Dawn isn't just a film you sit back and watch. It's a living universe we build together — one vote, one render, and one wild plot twist at a time.<span style=\"display:block;margin-top:1rem;font-family:'Montserrat',sans-serif;font-size:.72rem;font-style:normal;letter-spacing:2px;text-transform:uppercase;color:var(--accent-color)\">Democracy has arrived in cinema, and it carries high-voltage VFX.<\u002Fspan><\u002Fp>\n        <p style=\"text-align:center;font-style:italic;color:var(--text-main)\">Ready to shape the dawn?<br>Manny Van Delight — Visual Alchemist &amp; Storyteller<\u002Fp>\n        <div style=\"text-align:center;margin-top:3.5rem\"><a href=\"https://www.vandelight.art/links\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Montserrat',sans-serif;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--accent-color);padding-bottom:3px\">[ Cast Your Vote &amp; Explore The Universe ]<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article hidden=\"{{ hideSoon }}\">\n      <div style=\"min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8rem 0 6rem\">\n        <span style=\"display:block;font-family:'Montserrat',sans-serif;font-size:.7rem;letter-spacing:4px;text-transform:uppercase;color:var(--accent-color);margin-bottom:1.5rem\">In Production<\u002Fspan>\n        <h2 style=\"font-size:clamp(2.6rem,7vw,5.5rem);font-weight:400;font-style:italic;margin-bottom:1.5rem\">{{ soonTitle }}<\u002Fh2>\n        <p style=\"font-family:'Montserrat',sans-serif;font-size:.78rem;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:3rem\">{{ soonSub }}<\u002Fp>\n        <div style=\"width:100%;max-width:760px;aspect-ratio:16/9;border:1px solid var(--border-color);border-radius:4px;background-image:repeating-linear-gradient(45deg,var(--stripe-a) 0 10px,var(--stripe-b) 10px 20px);display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:.7rem;letter-spacing:.5px;color:var(--text-muted);text-align:center;padding:1rem\">{{ soonSlot }}<\u002Fdiv>\n        <p style=\"font-size:1.15rem;line-height:1.8;color:var(--text-muted);max-width:560px;margin:2.5rem auto 0;text-wrap:pretty\">The full case study is being curated. Drop me a line if you'd like an early look at the work in progress.<\u002Fp>\n        <div style=\"margin-top:2.5rem\"><a href=\"mailto:mannyvandelight@gmail.com\" style=\"font-family:'Montserrat',sans-serif;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--accent-color);padding-bottom:3px\">[ Get in touch ]<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div aria-hidden=\"{{ lbHidden }}\" style=\"position:fixed;inset:0;z-index:300;background:rgba(8,8,8,.94);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:clamp(1rem,5vw,4rem);opacity:{{ lbOpacity }};pointer-events:{{ lbPointer }};transition:opacity .35s ease\">\n  <button sc-camel-on-click=\"{{ closeLightbox }}\" aria-label=\"Close\" style=\"position:absolute;top:1.25rem;right:1.5rem;font-family:'Montserrat',sans-serif;font-size:.68rem;letter-spacing:3px;text-transform:uppercase;color:#F7F7F5;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);padding:.7rem 1.2rem;border-radius:40px;transition:all .3s\" style-hover=\"background:var(--accent-color);border-color:var(--accent-color)\">[ Close ]<\u002Fbutton>\n  <div style=\"width:100%;max-width:1200px\">\n    <sc-if value=\"{{ lbIsVideo }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:100%;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000\">\n        <iframe ref=\"{{ lbFrameRef }}\" title=\"{{ lbTitle }}\" allow=\"autoplay; encrypted-media; fullscreen; picture-in-picture\" allowfullscreen=\"allowfullscreen\" style=\"width:100%;height:100%;border:0;display:block\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ lbIsFile }}\" hint-placeholder-val=\"{{ false }}\">\n      <video ref=\"{{ lbVideoRef }}\" controls=\"controls\" playsinline=\"playsinline\" style=\"display:block;margin:0 auto;width:100%;max-height:78vh;border-radius:4px;background:#000\"><\u002Fvideo>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ lbIsImage }}\" hint-placeholder-val=\"{{ false }}\">\n      <img ref=\"{{ lbImgRef }}\" alt=\"{{ lbTitle }}\" style=\"display:block;margin:0 auto;max-width:100%;max-height:78vh;object-fit:contain;border-radius:4px\">\n    <\u002Fsc-if>\n    <p style=\"font-family:'Montserrat',sans-serif;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:rgba(247,247
